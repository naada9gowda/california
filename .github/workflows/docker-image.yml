
name: Build, test, and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: naadaby/california

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          IMAGE_LOCAL: california-housing-ui:${{ github.sha }}
        run: docker build --tag "$IMAGE_LOCAL" .

      - name: Start container and verify the app
        env:
          IMAGE_LOCAL: california-housing-ui:${{ github.sha }}
        run: |
          docker run --detach --name california-housing-ui-smoke --publish 8501:8501 "$IMAGE_LOCAL"

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            docker logs california-housing-ui-smoke
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8501/ > /dev/null

      - name: Validate bundled model prediction
        run: |
          docker exec california-housing-ui-smoke python -c "import math, mlflow.sklearn; model = mlflow.sklearn.load_model('/app/model'); predictions = model.predict([[5.0, 20.0, 5.0, 1.0, 1000.0, 3.0, 36.0, -120.0]]); assert len(predictions) == 1 and math.isfinite(float(predictions[0]))"

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force california-housing-ui-smoke || true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_LOCAL: california-housing-ui:${{ github.sha }}
        run: |
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
